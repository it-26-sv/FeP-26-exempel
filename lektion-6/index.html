<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lektion 6</title>
    <style type="text/css">

        .lights {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            margin-bottom: 2px;
            border-radius: 50%;

            /* cursor: url("./img/wand.svg") 7 7, url("./img/cursor.png") 10 10, pointer; */
            cursor: url("./img/wand.svg") 7 7, pointer;       
        }
        #container, #container-2 {
            float: left;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="light-1" class="lights"></div>
        <div id="light-2" class="lights"></div>
        <div id="light-3" class="lights"></div>
    </div>

    <div id="container-2">
        <div class="lights foo bar" data-color="red"></div>
        <div class="lights" data-color="yellow"></div>
        <div class="lights" data-color="lime"></div>
    </div>
    
    <script src="script.js"></script>

</html>
