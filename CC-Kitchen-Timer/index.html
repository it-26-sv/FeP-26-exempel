<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Äggklocka</title>
</head>
<body>
    <div id="output" style="font-size: 20px;">...</div>
    <input type="number" id="tid" placeholder="Sekunder">
    <button id="btn-timer">Start</button>
    
    <script>
        let sekunder;
        let timer = null;

        function updateOutput(content) {
            document.getElementById('output').textContent = content;
        }

        function startTimer() {

            if (timer !== null) return; // starta inte en ny timer om den gamla ännu finns

            sekunder = Number(document.getElementById('tid').value);

            updateOutput(sekunder);

            timer = setInterval(() => {

                sekunder--;
                updateOutput(sekunder);

                if (sekunder <= 0) {
                    updateOutput("Tiden är ute");
                    clearInterval(timer);
                    timer = null;
                }                
                
            }, 1000);
        }

        document.getElementById('btn-timer').addEventListener('click', startTimer);
    </script>
</body>
</html>
